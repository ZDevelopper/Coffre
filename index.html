<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Coffre</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #101215;
    color: #9aa0a8;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .door {
    width: 100%;
    max-width: 440px;
    padding: 28px 22px 26px;
    border-radius: 14px;
    background: linear-gradient(160deg, #2e3239 0%, #22252b 55%, #1b1e23 100%);
    border: 1px solid #3a3f47;
    box-shadow: 0 0 0 6px #17191d, 0 0 0 7px #2b2f36, 0 24px 60px rgba(0,0,0,.6),
                inset 0 1px 0 rgba(255,255,255,.06);
    position: relative;
  }
  .rivet {
    position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5a6069, #1c1f24);
  }
  .rivet.tl { top: 10px; left: 10px; } .rivet.tr { top: 10px; right: 10px; }
  .rivet.bl { bottom: 10px; left: 10px; } .rivet.br { bottom: 10px; right: 10px; }

  .status {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
    margin-bottom: 18px;
  }
  .led {
    width: 8px; height: 8px; border-radius: 50%;
    background: #c0392b; box-shadow: 0 0 8px rgba(192,57,43,.8);
  }
  .open .led { background: #3fae5a; box-shadow: 0 0 8px rgba(63,174,90,.8); }

  .lcd {
    background: linear-gradient(180deg, #98a48a, #a6b197);
    border-radius: 6px;
    border: 2px solid #111316;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.35);
    padding: 14px 12px 12px;
    text-align: center;
  }
  .lcd + .lcd { margin-top: 14px; }
  .label {
    font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
    color: #2a3024; opacity: .75; margin-top: 6px;
  }
  .row { display: flex; justify-content: center; align-items: flex-end; gap: 4px; }
  .digit { height: 100%; width: auto; display: block; }
  .digit polygon, .dot, .colon i { fill: #1b2016; background: #1b2016; opacity: .07; }
  .digit polygon.on { opacity: .92; }
  .days { height: 62px; }
  .hms { height: 40px; margin-top: 14px; }
  .code { height: 54px; }
  .colon {
    display: flex; flex-direction: column; justify-content: center; gap: 9px;
    height: 100%; padding: 0 3px;
  }
  .colon i { width: 5px; height: 5px; opacity: .92; display: block; }
  .dot { width: 6px; height: 6px; margin: 0 2px 2px; opacity: .92; }
  .dot.off { opacity: .07; }

  .wheel {
    width: 92px; height: 92px; margin: 24px auto 0; border-radius: 50%;
    border: 7px solid #3b4048;
    box-shadow: 0 4px 10px rgba(0,0,0,.5), inset 0 2px 5px rgba(0,0,0,.5);
    position: relative;
    transition: transform 2.4s cubic-bezier(.3,.1,.2,1);
  }
  .wheel::before, .wheel::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 78px; height: 6px; margin: -3px 0 0 -39px;
    background: #3b4048; border-radius: 3px;
  }
  .wheel::after { transform: rotate(90deg); }
  .hub {
    position: absolute; left: 50%; top: 50%; width: 22px; height: 22px;
    margin: -11px 0 0 -11px; border-radius: 50%; z-index: 1;
    background: radial-gradient(circle at 35% 30%, #666c76, #23262b);
  }
  .open .wheel { transform: rotate(270deg); }

  .note {
    text-align: center; font-size: 11px; letter-spacing: .12em;
    margin-top: 20px; color: #6d737b;
  }
  @media (max-width: 360px) {
    .days { height: 50px; } .hms { height: 32px; } .code { height: 44px; }
  }
</style>
</head>
<body>
<main class="door" id="door">
  <span class="rivet tl"></span><span class="rivet tr"></span>
  <span class="rivet bl"></span><span class="rivet br"></span>

  <div class="status"><span class="led"></span><span id="status">Verrouillé</span></div>

  <section class="lcd">
    <div class="row days" id="days"></div>
    <div class="label">Jours</div>
    <div class="row hms" id="hms"></div>
    <div class="label">Heures &nbsp;·&nbsp; Minutes &nbsp;·&nbsp; Secondes</div>
  </section>

  <section class="lcd">
    <div class="row code" id="code"></div>
    <div class="label">Code</div>
  </section>

  <div class="wheel"><span class="hub"></span></div>
  <p class="note" id="note">Ouverture le 21 novembre 2036</p>
</main>

<script>
(function () {
  // Ouverture : 21 novembre 2036 à 00:00, heure de Paris (UTC+1)
  var TARGET = Date.UTC(2036, 10, 20, 23, 0, 0);
  // Code masqué (base64 inversé)
  var K = "0YjM";

  var SEG = {
    a: "2,1.5 3,0.5 9,0.5 10,1.5 9,2.5 3,2.5",
    g: "2,11 3,10 9,10 10,11 9,12 3,12",
    d: "2,20.5 3,19.5 9,19.5 10,20.5 9,21.5 3,21.5",
    f: "1.5,2 2.5,3 2.5,9.5 1.5,10.5 0.5,9.5 0.5,3",
    b: "10.5,2 11.5,3 11.5,9.5 10.5,10.5 9.5,9.5 9.5,3",
    e: "1.5,11.5 2.5,12.5 2.5,19 1.5,20 0.5,19 0.5,12.5",
    c: "10.5,11.5 11.5,12.5 11.5,19 10.5,20 9.5,19 9.5,12.5"
  };
  var MAP = {
    "0": "abcdef", "1": "bc", "2": "abged", "3": "abgcd", "4": "fgbc",
    "5": "afgcd", "6": "afgecd", "7": "abc", "8": "abcdefg", "9": "abcdfg",
    "-": "g", " ": ""
  };

  function digit(ch) {
    var on = MAP[ch] !== undefined ? MAP[ch] : "g";
    var s = '<svg class="digit" viewBox="0 0 12 22" aria-hidden="true">';
    for (var k in SEG) {
      s += '<polygon points="' + SEG[k] + '"' + (on.indexOf(k) >= 0 ? ' class="on"' : "") + "/>";
    }
    return s + "</svg>";
  }
  function render(el, text) {
    var html = "";
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch === ":") html += '<span class="colon"><i></i><i></i></span>';
      else if (ch === ".") html += '<span class="dot"></span>';
      else html += digit(ch);
    }
    if (el._t !== text) { el.innerHTML = html; el._t = text; }
  }
  function pad(n, l) { n = String(n); while (n.length < l) n = "0" + n; return n; }

  var door = document.getElementById("door");
  var elDays = document.getElementById("days");
  var elHms = document.getElementById("hms");
  var elCode = document.getElementById("code");
  var timer;

  function tick() {
    var left = TARGET - Date.now();
    if (left <= 0) {
      render(elDays, "0000");
      render(elHms, "00:00:00");
      render(elCode, atob(K.split("").reverse().join("")));
      door.className = "door open";
      document.getElementById("status").textContent = "Ouvert";
      document.getElementById("note").textContent = "Dix ans plus tard.";
      clearInterval(timer);
      return;
    }
    var s = Math.floor(left / 1000);
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600;
    var m = Math.floor(s / 60); s -= m * 60;
    render(elDays, pad(d, 4));
    render(elHms, pad(h, 2) + ":" + pad(m, 2) + ":" + pad(s, 2));
    render(elCode, "---");
  }
  timer = setInterval(tick, 1000);
  tick();
})();
</script>
</body>
</html>
